version: '3.8'

services:
  creds:
    image: mongo:latest
    container_name: creds
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: creds
    volumes:
      - creds_data:/data/db
    networks:
      - app_network

volumes:
  creds_data:

networks:
  app_network:
    driver: bridge